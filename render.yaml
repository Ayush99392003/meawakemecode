services:
  - type: web
    name: meawakemecode-email-worker
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: true
      - key: GMAIL_WEBAPP_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: APP_BASE_URL
        value: https://meawakemecode-8a35b.web.app
      - key: PORT
        value: 8080
